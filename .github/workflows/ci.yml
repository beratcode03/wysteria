name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Wysteria Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@f94e14f6b3b0d77eb6be4df6685f0ef3a726359f # v5.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Code quality & formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test suite
        run: uv run pytest

      - name: Package build
        run: uv build

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Wysteria contract verification (fixture)
        run: |
          uv run wysteria verify \
            examples/workflows/user_transform_flow.yaml \
            --fixture examples/fixtures/fixture_trim_upper.yaml \
            --report-file artifacts/verification-report.json \
            --github-annotations

      - name: Wysteria regression baseline check
        run: |
          uv run wysteria baseline check \
            examples/workflows/user_transform_flow.yaml \
            --fixture examples/fixtures/fixture_trim_upper.yaml \
            --baseline examples/baselines/user_transform_baseline.json \
            --report-file artifacts/baseline-report.json \
            --github-annotations

      - name: Upload verification report artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: wysteria-ci-reports
          path: artifacts/
          if-no-files-found: ignore
